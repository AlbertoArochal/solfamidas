# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: AlbertoArochal/solfamidas
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/7fb522fc-a57a-4583-bb03-7de03f513546/pkce
  auth_token_endpoint: /sites/7fb522fc-a57a-4583-bb03-7de03f513546/token
  gateway_url: https://gateway.decapbridge.com

  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Enable PKCE fields (optional, recommended)
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Add site links in Decap CMS (optional)
site_url: https://solfamidas.vercel.app

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "config"
    label: "Configuración General"
    files:
      - file: "src/data/site.json"
        label: "Datos del Músico y SEO"
        name: "site_info"
        fields:
          - { label: "Nombre / Agrupación", name: "title", widget: "string" }
          - { label: "Especialidad", name: "instrument", widget: "string" }
          - { label: "Descripción Corta (SEO)", name: "description", widget: "text" }
          - { label: "Email de Contacto", name: "email", widget: "string" }
          - { label: "Teléfono / WhatsApp", name: "phone", widget: "string" }
          - { label: "Ciudad Principal", name: "city", widget: "string" }
          - { label: "Instagram", name: "instagram", widget: "string", required: false }
          - { label: "Texto de Contacto", name: "contactIntro", widget: "text" }

  - name: "eventos"
    label: "Agenda y Eventos"
    folder: "src/content/eventos"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Título del Concierto / Evento", name: "title", widget: "string" }
      - { label: "Fecha y Hora", name: "date", widget: "datetime" }
      - { label: "Ubicación / Sala", name: "location", widget: "string" }
      - { label: "Ciudad", name: "city", widget: "string" }
      - { label: "Tipo", name: "type", widget: "select", options: ["Recital Solo", "Boda / Gala", "Música de Cámara", "Evento Privado"] }
      - { label: "Enlace Entradas / Info", name: "link", widget: "string", required: false }

  - name: "galeria"
    label: "Galería de Fotos"
    folder: "src/content/galeria"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título / Descripción", name: "title", widget: "string" }
      - { label: "Imagen", name: "image", widget: "image" }
      - { label: "Categoría", name: "category", widget: "select", options: ["Conciertos", "Bodas", "Sesión Editorial", "Detrás de Escena"] }

  - name: "media"
    label: "Multimedia (Audio / Video)"
    folder: "src/content/media"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - {
          label: "Tipo de Embed",
          name: "type",
          widget: "select",
          options:
            [
              { label: "YouTube", value: "youtube" },
              { label: "SoundCloud", value: "soundcloud" },
              { label: "Spotify", value: "spotify" },
              { label: "Vimeo", value: "vimeo" },
            ],
        }
      - { label: "URL del contenido", name: "url", widget: "string", hint: "Pega el enlace del vídeo o pista (YouTube, SoundCloud, Spotify o Vimeo)" }
      - { label: "Descripción (opcional)", name: "description", widget: "text", required: false }

  - name: "bio"
    label: "Biografía"
    folder: "src/content/bio"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Contenido", name: "body", widget: "markdown" }

  - name: "repertorio"
    label: "Repertorio"
    files:
      - file: "src/data/site.json"
        label: "Lista de Repertorio"
        name: "repertorio_items"
        fields:
          - { label: "Título de la Sección", name: "repertorioTitle", widget: "string" }
          - { label: "Texto Introductorio", name: "repertorioIntro", widget: "text" }
          - { label: "Piezas / Programas", name: "repertorio", widget: "list", fields: [{ label: "Pieza", name: "item", widget: "string" }] }
